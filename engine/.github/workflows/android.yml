name: Android APK
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/large-canvas-12000, codex/line-curve-delete-point, codex/image-layer-transform]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: velyntora-core-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
