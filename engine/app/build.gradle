plugins { id 'com.android.library' }
android {
 namespace 'art.velyntora.core'
 compileSdk 35
 defaultConfig {
  minSdk 23
  targetSdk 28
  versionCode 1
  versionName '0.1.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra -O2' } }
 }
 externalNativeBuild { cmake { path file('../core/CMakeLists.txt'); version '3.22.1' } }
 sourceSets { main { java.srcDirs += ['../tools'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation 'com.caverock:androidsvg-aar:1.4'
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Bundled, pinned model: app never needs a network connection for Remove AI.
def removeAssets = layout.buildDirectory.dir('generated/removeAiAssets')
android.sourceSets.main.assets.srcDirs += [file('../tools/remove_ai/assets'), removeAssets, file('../tools/brush/velyntora_brush')]
tasks.register('prepareRemoveAiModel') {
 def target = removeAssets.map { it.file('remove_ai/migan_pipeline_v2.onnx') }
 outputs.file(target)
 doLast {
  def model = target.get().asFile
  model.parentFile.mkdirs()
  if (!model.exists()) {
   new URL('https://huggingface.co/andraniksargsyan/migan/resolve/1538c135034b8cfe7a8472f34d09c8a5a45b17a7/migan_pipeline_v2.onnx').withInputStream { input -> model.withOutputStream { output -> output << input } }
  }
  def hash = java.security.MessageDigest.getInstance('SHA-256')
  model.withInputStream { input -> byte[] buffer = new byte[65536]; int n; while ((n = input.read(buffer)) != -1) hash.update(buffer, 0, n) }
  if (hash.digest().encodeHex().toString() != '6f1f3530a1a2324b19752018ce756088b07973cda8d7d890034ace5c8a48c40b') {
   model.delete(); throw new GradleException('MI-GAN SHA256 mismatch')
  }
 }
}
tasks.named('preBuild').configure { dependsOn 'prepareRemoveAiModel' }
