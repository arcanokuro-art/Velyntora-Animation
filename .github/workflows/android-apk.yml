name: Android Animation piloto
on:
  push:
    branches: [main, Android-AN]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: animation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Pruebas Animation y motor compartido
        run: |
          mkdir -p build/animation-tests
          javac -d build/animation-tests app/src/main/java/app/velyntora/animation/{frames/FrameSequence.java,playback/PlaybackClock.java,project/AnimationProject.java} tests/AnimationTests.java
          java -cp build/animation-tests AnimationTests
          python engine/scripts/check_modular_boundaries.py
          cmake -S engine/tests -B build/core-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/core-tests --parallel 2
          ctest --test-dir build/core-tests --output-on-failure
      - run: gradle :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Informes Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-test-results
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
      - run: cp app/build/outputs/apk/debug/app-debug.apk Velyntora-Animation-pilot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Velyntora-Animation-pilot
          path: Velyntora-Animation-pilot.apk
          if-no-files-found: error
