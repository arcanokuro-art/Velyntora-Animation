name: Android Animation
on:
  push:
    branches: [main, feature/animation-editor]
    paths-ignore: ['scripts/integrate_core.py', '.github/workflows/import-core.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: animation-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          cache-read-only: false
      - name: Verificar Animation y motor nativo
        run: |
          mkdir -p build/animation-tests
          javac -d build/animation-tests app/src/main/java/app/velyntora/animation/{model/AnimationSequence.java,storage/AnimationProject.java,playback/PlaybackClock.java} tests/AnimationModelTests.java
          java -cp build/animation-tests AnimationModelTests
          python engine/scripts/check_modular_boundaries.py
          cmake -S engine/tests -B build/core-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/core-tests --parallel 2
          ctest --test-dir build/core-tests --output-on-failure
      - run: gradle :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace; result=$?; adb pull /sdcard/Download/animation-editor-preview.png build/animation-editor.png; adb pull /sdcard/Download/animation-editor-phone.png build/animation-editor-phone.png; exit "$result"
            test -f build/animation-editor.png && test -s build/animation-editor.png
      - name: Informes y captura Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-integration-test-results
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            build/animation-editor*.png
      - run: cp app/build/outputs/apk/debug/app-debug.apk Velyntora-Animation-pilot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Velyntora-Animation-pilot
          path: Velyntora-Animation-pilot.apk
          if-no-files-found: error
      - name: Publicar APK de prueba
        if: github.ref == 'refs/heads/feature/animation-editor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view animation-preview >/dev/null 2>&1 || gh release create animation-preview --title "Velyntora Animation 0.3.1 · Pruebas" --notes "Editor de animación en rama de pruebas: fotogramas, capas, línea de tiempo, reproducción y proyectos." --prerelease --target "${{ github.sha }}"
          gh release edit animation-preview --title "Velyntora Animation 0.3.1 · Pruebas" --notes "Línea de tiempo rediseñada: controles superiores, selección rosa y cabezal de reproducción. Audio pendiente." --prerelease
          gh release upload animation-preview Velyntora-Animation-pilot.apk --clobber
      - name: Publicar APK piloto
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pilot-latest >/dev/null 2>&1 || gh release create pilot-latest --title "Velyntora Animation · Piloto" --notes "Versión piloto de Velyntora Animation." --prerelease
          gh release edit pilot-latest --title "Velyntora Animation · Piloto" --notes "Versión piloto de Velyntora Animation." --prerelease
          gh release upload pilot-latest Velyntora-Animation-pilot.apk --clobber
          obsolete_asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/pilot-latest" --jq '.assets[] | select(.name == "Velyntora-Drawing-pilot.apk") | .id')"
          if [ -n "$obsolete_asset_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${obsolete_asset_id}"
          fi
