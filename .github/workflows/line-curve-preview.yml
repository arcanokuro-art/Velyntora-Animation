name: Linea Curva - prueba y APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/tools/line_curve/**'
      - 'engine/tests/Curve*'
      - '.github/workflows/line-curve-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Verificar curvas, esquinas e historial
        run: |
          mkdir -p build/curve-tests
          javac -d build/curve-tests engine/tools/line_curve/CurveDraft.java engine/tools/line_curve/CurveHistory.java engine/tests/CurveDraftTests.java engine/tests/CurveHistoryTests.java
          java -cp build/curve-tests art.velyntora.core.CurveDraftTests
          java -cp build/curve-tests art.velyntora.core.CurveHistoryTests
          python engine/scripts/check_modular_boundaries.py
      - name: Compilar y revisar APK
        run: gradle :app:assembleDebug :app:lintDebug :drawing-engine:compileDebugAndroidTestJavaWithJavac --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Linea-Curva-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK de prueba en Releases
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/line-curve-corners-smooth'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REPO_NAME: ${{ github.event.repository.name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          asset="${APP_REPO_NAME}-Linea-Curva.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          gh release view line-curve-corners-preview >/dev/null 2>&1 || gh release create line-curve-corners-preview --target "$SOURCE_SHA" --title "Línea/Curva · Esquinas y curvas originales" --notes "APK de prueba: puntos de esquina y comportamiento original de las curvas. Toca un punto interior para elegir Convertir en esquina o Convertir en curva. Incluye deshacer y rehacer. Pendiente de validación táctil antes de integrar en main." --prerelease
          gh release edit line-curve-corners-preview --title "Línea/Curva · Esquinas y curvas originales" --notes "APK actualizado: conserva el comportamiento original de las curvas y añade la opción de convertir puntos interiores en esquinas. Incluye deshacer y rehacer. Pendiente de validación táctil antes de integrar en main." --prerelease
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/line-curve-corners-preview" -f sha="$SOURCE_SHA"
          gh release upload line-curve-corners-preview "$asset" --clobber
