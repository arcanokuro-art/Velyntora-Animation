plugins { id 'com.android.application' }

android {
    namespace 'app.velyntora'
    compileSdk 35
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'app.velyntora.drawing'
        minSdk 26
        targetSdk 35
        versionCode 2
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionName '0.2.0-pilot'
    }
}

dependencies { implementation project(':drawing-engine'); androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
